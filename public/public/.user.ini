; OPcache for shared hosting (Apache / LiteSpeed often reads public/.user.ini)
; Upload to public/ on production. After PHP deploys, restart PHP-FPM or wait for revalidate.

max_execution_time=60
max_input_time=60

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Shared hosting: revalidate so FTP uploads pick up without full PHP restart
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
opcache.jit=0
